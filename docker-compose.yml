services:
  redis:
    extends:
      file: docker-compose.base.yaml
      service: redis
    container_name: redis
    ports:
      - "6379:6379"

  nats:
    extends:
      file: docker-compose.base.yaml
      service: nats
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infra/nats/jetstream:/data/jetstream
      - ./infra/nats/nats.conf:/etc/nats/nats.conf

  forwarder:
    image: lidofinance/onchain-mon:stable
    container_name: forwarder
    build: ./
    restart: always
    command:
      - ./forwarder
    env_file:
      - .env
    environment:
      - READ_ENV_FROM_SHELL=true
      - ENV=${ENV}
      - APP_NAME=forwarder
      - PORT=8080
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL}
      - NATS_DEFAULT_URL=http://nats:4222
      - REDIS_ADDRESS=redis:6379
      - REDIS_DB=${REDIS_DB}
      - QUORUM_SIZE=${QUORUM_SIZE}
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - nats
    volumes:
      # ReadNotificationConfig uses the given path when ENV=local and hardcodes
      # /etc/forwarder/notification.yaml otherwise, so mount both.
      - ./notification.yaml:/app/notification.yaml
      - ./notification.yaml:/etc/forwarder/notification.yaml

  feeder:
    image: lidofinance/onchain-mon:stable
    container_name: feeder
    build: ./
    restart: always
    command:
      - ./feeder
    env_file:
      - .env
    environment:
      - READ_ENV_FROM_SHELL=true
      - ENV=${ENV}
      - APP_NAME=feeder
      - PORT=8080
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL}
      - NATS_DEFAULT_URL=http://nats:4222
      - REDIS_ADDRESS=redis:6379
      - BLOCK_TOPIC=${BLOCK_TOPIC}
    ports:
      - "8082:8080"
    depends_on:
      - redis
      - nats

  prometheus:
    extends:
      file: docker-compose.base.yaml
      service: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - feeder
      - forwarder

  grafana:
    extends:
      file: docker-compose.base.yaml
      service: grafana
    container_name: grafana
    environment:
      - GRAFANA_DS_UID=${GRAFANA_DS_UID}
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
