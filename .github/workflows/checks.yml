---
name: checks

on:
  pull_request:
  push:
    branches:
      - main
      - devel
      - develop

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          GOBIN=$PWD/bin go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check formatting
        run: make check-format

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          GOBIN=$PWD/bin go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run linters
        run: make lint

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          GOBIN=$PWD/bin go install \
            golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: make vulncheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Don't spend runner time (and a Redis service) on a tree with known
    # vulnerable dependencies.
    needs: vulncheck
    # Redis backs the consumer quorum tests. Tests that need the repo-root .env
    # and post to real channels sit behind the `live` build tag and are not run
    # here — use `make test-live` locally for those.
    services:
      redis:
        image: redis:7.0.15-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          go build -o ./bin/feeder ./cmd/feeder
          go build -o ./bin/forwarder ./cmd/forwarder

      - name: Run tests
        run: make test

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    # Catch a broken Dockerfile here instead of at deploy time. The image is
    # built but never pushed — publishing stays in the deploy workflows.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: onchain-mon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binaries are in the image
        run: |
          docker run --rm --entrypoint ls onchain-mon:ci -l /app/feeder /app/forwarder
