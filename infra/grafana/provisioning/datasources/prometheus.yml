apiVersion: 1

datasources:
  # The dashboard references its datasource by uid, so it has to match.
  # The value is environment-specific — set GRAFANA_DS_UID in .env.
  - name: Prometheus
    type: prometheus
    uid: $GRAFANA_DS_UID
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
