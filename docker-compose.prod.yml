x-logging: &default-logging
  options:
    max-size: "50m"
    max-file: "10"

services:
  # ---------- Shared Redis ----------
  redis:
    extends:
      file: docker-compose.base.yaml
      service: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - redis-net

  # ========== CELL 1 ==========
  nats-1:
    extends:
      file: docker-compose.base.yaml
      service: nats
    container_name: nats-1
    volumes:
      - ./infra/nats/jetstream-1:/data/jetstream
      - ./infra/nats/nats.conf:/etc/nats/nats.conf
    networks: [cell1-net]
    logging: *default-logging

  forwarder-1:
    image: lidofinance/onchain-mon:stable
    container_name: forwarder-1
    build: ./
    command: [ "./forwarder" ]
    restart: always
    env_file: [ .env ]
    environment:
      READ_ENV_FROM_SHELL: "true"
      ENV: ${ENV}
      APP_NAME: ${APP_NAME}
      PORT: ${PORT}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_DEFAULT_URL: http://nats-1:4222
      REDIS_ADDRESS: redis:6379
      REDIS_DB: ${REDIS_DB}
      QUORUM_SIZE: ${QUORUM_SIZE}
      SOURCE: local-1
    depends_on: [redis, nats-1]
    networks: [cell1-net, redis-net]
    volumes:
      - ./notification.yaml:/app/notification.yaml
      - ./notification.yaml:/etc/forwarder/notification.yaml
    logging: *default-logging

  feeder-1:
    image: lidofinance/onchain-mon:stable
    container_name: feeder-1
    build: ./
    command: [ "./feeder" ]
    restart: always
    env_file: [ .env ]
    environment:
      READ_ENV_FROM_SHELL: "true"
      ENV: ${ENV}
      APP_NAME: ${APP_NAME}
      PORT: ${PORT}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_DEFAULT_URL: http://nats-1:4222
      REDIS_ADDRESS: redis:6379
      BLOCK_TOPIC: blocks.mainnet.l1
      SOURCE: local-1
    depends_on: [redis, nats-1]
    networks: [cell1-net, redis-net]
    logging: *default-logging

  steth-1:
    image: monitoring/steth-v2:latest
    container_name: ethereum-steth-v2-1
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      HOME: /tmp
      YARN_CACHE_FOLDER: /tmp/.yarn-cache
      npm_config_prefix: /tmp/.yarn-global
      APP_NAME: ethereum-steth-v2
      INSTANCE: local-1
      ETHEREUM_RPC_URL: ${JSON_RPC_URL}
      NATS_SERVER_URL: http://nats-1:4222
      NATS_LISTEN_TOPIC: ${BLOCK_TOPIC}
      CHAIN_ID: "1"
      DB_FILEPATH: /data/steth.sqlite
    depends_on: [nats-1]
    networks: [cell1-net]
    logging: *default-logging
    volumes:
      - ./infra/steth-db/1:/data

  # ========== CELL 2 ==========
